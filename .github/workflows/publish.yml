name: publish

# A plugin version bump on main is the release intent: CI tags that commit,
# publishes it to npm, and opens a GitHub Release. Pushing v<version> remains
# available for recovery. The tag must match the plugin package version.
#
# npm publishing uses Trusted Publishing: GitHub's OIDC token proves the
# workflow's identity to npm, so no NPM_TOKEN secret exists to leak or expire.
# Configure it once at
#   https://www.npmjs.com/package/@metal-huang/dsh-workspace-split/access
# with repository `metal-huang/dsh-workspace-split` and workflow `publish.yml`.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # required by Trusted Publishing

# Serialize releases so a slower old version cannot become npm latest after a
# newer one. A new run supersedes a queued run, but never cancels one publishing;
# the newest main run also releases an untagged current version, so a superseded
# queued version bump cannot fall through the cracks.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The main-branch check compares the versions at event.before and HEAD;
          # tag alignment and recovery also need the existing tags.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # On main, a changed or currently untagged plugin version means "release".
      # Comparing the whole push (not just HEAD^) publishes only the final version
      # when one push contains several release commits. Tag runs recover releases.
      - name: Resolve release intent
        id: version
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          package_path=packages/dsh-workspace-split/package.json
          version=$(node -p "require('./$package_path').version")
          tag="v$version"
          release=true
          create_tag=false

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" = main ]; then
            if [ "$GITHUB_EVENT_NAME" != push ]; then
              echo "Manual recovery must run on an existing version tag, not main." >&2
              exit 1
            fi
            before_version=$(git show "$BEFORE:$package_path" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            if [ "$before_version" = "$version" ]; then
              release=false
              if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                # A newer push can replace a queued version-bump run. Do not
                # let that queued cancellation lose the release altogether.
                echo "Plugin version $version has no tag; recovering the release."
                release=true
              else
                echo "Plugin version $version is unchanged and tagged; nothing to release."
              fi
            fi
          else
            echo "publish only supports main and version tags, got $GITHUB_REF" >&2
            exit 1
          fi

          if [ "$release" = true ]; then
            main_version=$(git show "origin/main:$package_path" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            if [ "$main_version" != "$version" ]; then
              # A stale rerun must never publish an old version after a newer
              # one and move npm latest backwards. The newest main run owns it.
              echo "main is at $main_version, refusing stale release $version" >&2
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              tagged_commit=$(git rev-parse "$tag^{}")
              if [ "$tagged_commit" != "$(git rev-parse HEAD)" ]; then
                echo "$tag already points at $tagged_commit, not $(git rev-parse HEAD)" >&2
                exit 1
              fi
            elif [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "checked out tag $tag is missing" >&2
              exit 1
            else
              create_tag=true
            fi
          fi

          already=false
          if [ "$release" = true ]; then
            set +e
            npm_lookup=$(npm view "@metal-huang/dsh-workspace-split@$version" version 2>&1)
            npm_status=$?
            set -e
            if [ "$npm_status" -eq 0 ]; then
              already=true
            elif [[ "$npm_lookup" != *E404* ]]; then
              # Only a definite not-found means unpublished. A network or
              # registry failure must stop before creating a tag or publishing.
              echo "$npm_lookup" >&2
              exit "$npm_status"
            fi
            if [ "$create_tag" = true ] && [ "$already" = true ]; then
              echo "$version exists on npm but $tag is missing; restore the original tag instead of tagging a new commit." >&2
              exit 1
            fi
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
          echo "already=$already" >> "$GITHUB_OUTPUT"

      # Trusted Publishing needs npm >= 11.5; Node 22 ships an older one.
      - name: Update npm
        if: steps.version.outputs.release == 'true'
        run: npm install -g npm@latest

      # The lockfile is generated on Windows and lacks Linux-only optional
      # binaries (jscpd's native module), so resolve instead of a strict ci.
      - name: Install repository tooling
        if: steps.version.outputs.release == 'true'
        run: npm install --no-audit --no-fund

      - name: Install plugin build dependencies
        if: steps.version.outputs.release == 'true'
        run: npm install --no-audit --no-fund
        working-directory: packages/dsh-workspace-split

      # The client artifact is generated, not tracked. Build it here so a
      # checkout that cannot build fails before the publish step; the package's
      # `prepare` rebuilds it again while packing, so the tarball matches this
      # commit rather than anyone's working tree.
      - name: Build the client artifact
        if: steps.version.outputs.release == 'true'
        run: npm run build
        working-directory: packages/dsh-workspace-split

      # Contract tests: loader envelope, only platform modules required, and two
      # consecutive builds agreeing byte for byte.
      - name: Verify
        if: steps.version.outputs.release == 'true'
        run: npm run check

      # Create the tag only after the release commit passes its gate. Tags made
      # with GITHUB_TOKEN do not start another workflow, so this job publishes
      # directly instead of relying on a recursive tag-triggered run.
      - name: Tag the version commit
        if: steps.version.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "$TAG" HEAD
          git push origin "refs/tags/$TAG"

      # Retrying after a partial release must not fail on an existing npm
      # version; the Release step below can still finish the missing half.
      - name: Publish to npm
        if: steps.version.outputs.release == 'true' && steps.version.outputs.already == 'false'
        run: npm publish --provenance
        working-directory: packages/dsh-workspace-split

      - name: Create the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          set +e
          release_lookup=$(gh release view "$TAG" 2>&1)
          release_status=$?
          set -e
          if [ "$release_status" -eq 0 ]; then
            echo "Release $TAG already exists."
          elif [[ "$release_lookup" == *"release not found"* ]]; then
            gh release create "$TAG" --generate-notes --verify-tag
          else
            echo "$release_lookup" >&2
            exit "$release_status"
          fi
