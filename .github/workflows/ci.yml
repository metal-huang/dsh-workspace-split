name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The Windows-generated lockfile currently omits a Linux-only optional
      # binary. Keep this aligned with publish.yml until that lockfile is fixed.
      - name: Install repository tooling
        run: npm install --no-audit --no-fund

      - name: Install plugin build dependencies
        run: npm install --no-audit --no-fund
        working-directory: packages/dsh-workspace-split

      - name: Check PR diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "${BASE_SHA}...HEAD"

      # GitHub reuses this title for squash merges. Pass untrusted text through
      # the environment rather than interpolating it into a shell script.
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node gate/pr_title.mjs

      - name: Verify source, tests, and build
        run: npm run check:full
